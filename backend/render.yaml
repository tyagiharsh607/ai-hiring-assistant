services:
  - type: web
    name: ai-hiring-assistant-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: HUNAR_API_KEY
        sync: false
      - key: HUNAR_BASE_URL
        value: https://api.voice.hunar.ai/external/v1
      - key: HUNAR_SCREENING_AGENT_ID
        sync: false
      - key: HUNAR_REACHOUT_AGENT_ID
        sync: false
      - key: PDL_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./hiring.db
